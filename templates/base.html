{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f9d8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="買い物リスト">
  <title>{% block title %}買い物リスト{% endblock %}</title>
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/shopping.css' %}">
</head>
<body data-user-id="{{ user.pk|default:'' }}" data-tap-url-pattern="{% url 'shopping:api-tap' 0 %}">
  <nav class="navbar navbar-dark app-navbar"><div class="container app-width">
    <a class="navbar-brand" href="{% url 'shopping:list' %}"><img src="{% static 'icons/cart.svg' %}" width="28" height="28" alt=""> 買い物リスト</a>
    {% if user.is_authenticated %}<details class="nav-menu"><summary aria-label="メニュー">⋯</summary><div>
      <a href="{% url 'shopping:list' %}">リスト</a>
      <a href="{% url 'shopping:add' %}">品目を追加</a>
      <a href="{% url 'shopping:paste' %}">LINEから貼り付け</a><a href="{% url 'shopping:items' %}">品目の管理</a><a href="{% url 'shopping:sections' %}">ジャンルの管理</a>
      <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">ログアウト</button></form>
    </div></details>{% endif %}
  </div></nav>
  <main class="app-width page-content">
    {% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="app-toast" role="status" aria-live="polite" hidden><span></span><button type="button" hidden>元に戻す</button></div>
  <dialog id="sheet" class="bottom-sheet"><div class="sheet-header"><h2 id="sheet-title"></h2><button type="button" data-close-sheet aria-label="閉じる">×</button></div><div id="sheet-body"></div></dialog>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/shopping.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
